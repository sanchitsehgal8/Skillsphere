    <script>
      // Set theme before paint to avoid flash of wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('skillsphere-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>

        <p>
          SkillSphere turns real GitHub, résumé, and Codeforces signals into an explainable engineering
          scorecard — with role-fit matching, ramp-up estimates, and built-in fairness auditing.

          <li><strong>17-dimension explainable scorecard</strong> — every score carries its own confidence, reasoning, and cited evidence.</li>

          <li><strong>Time-to-productivity estimates</strong> — projected ramp-up in focused hours and sprints.</li>
          <li><strong>Fairness auditing</strong> — automatic bias checks with severity-tagged flags on every match.</li>
